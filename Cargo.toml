[package]
name = "rs-legibility-lints"
version = "0.1.0"
edition = "2024"
description = "Rust legibility rules for Dylint"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "=6.2.0"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
dylint_testing = "=6.2.0"

[lints.rust]
unsafe_code = "deny"
unused_extern_crates = "warn"

[lints.clippy]
allow_attributes_without_reason = "warn"
arbitrary_source_item_ordering = "warn"
blocks_in_conditions = "warn"
excessive_nesting = "warn"
manual_let_else = "warn"
nonminimal_bool = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
unused_async = "warn"

[workspace]
exclude = ["target"]

[package.metadata.rust-analyzer]
rustc_private = true
