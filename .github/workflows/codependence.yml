name: Update dependencies

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  update:
    name: Update Cargo lockfile and GitHub Actions
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain

      - name: Install Codependence
        run: brew install yowainwright/tap/codependence

      - name: Update dependencies
        run: |
          set -euo pipefail
          codependence --update --language github-actions
          cargo update

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.CODEPENDENCE_TOKEN }}
          branch: update-dependencies
          delete-branch: true
          add-paths: |
            .github/workflows/*.yml
            Cargo.lock
          title: "chore: update dependencies"
          commit-message: "chore: update dependencies"
          body: |
            Automated updates for GitHub Actions and compatible Cargo lockfile dependencies.
            The pinned Rust compiler and Dylint versions are unchanged.
