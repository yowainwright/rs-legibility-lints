name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check-tag:
    name: Check release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Check tag is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check tag matches package version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$GITHUB_REF_NAME" = "v${version}"

  test:
    name: Validate and build
    needs: check-tag
    uses: ./.github/workflows/ci.yml
    with:
      release_artifacts: true

  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Download release plugins
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: release-*
          path: target/release-artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: target/release-artifacts
        run: sha256sum ./*.tar.gz > checksums.txt

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            target/release-artifacts/*.tar.gz
            target/release-artifacts/checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" target/release-artifacts/*.tar.gz target/release-artifacts/checksums.txt --verify-tag --generate-notes --title "$RELEASE_TAG"
